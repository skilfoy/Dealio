services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dealradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealradar_dev}
      POSTGRES_DB: ${POSTGRES_DB:-dealradar}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dealradar}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dealradar-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dealradar-net

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dealradar-net

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker -l info -c 4 -Q default,scrapers
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - api
    networks:
      - dealradar-net

  beat:
    build: ./backend
    command: celery -A app.tasks.celery_app beat -l info --schedule /tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - worker
    networks:
      - dealradar-net

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - dealradar-net

volumes:
  pgdata:

networks:
  dealradar-net:
    driver: bridge
